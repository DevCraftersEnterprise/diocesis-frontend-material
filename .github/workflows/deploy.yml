name: Deploy Angular to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy start time
        run: echo "DEPLOY_STARTED_TS=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Chrome sin sandbox (runner de CI)
        run: |
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "#!/bin/sh" > "$RUNNER_TEMP/chrome-nosandbox"
          echo 'exec "$CHROME_PATH" --no-sandbox "$@"' >> "$RUNNER_TEMP/chrome-nosandbox"
          chmod +x "$RUNNER_TEMP/chrome-nosandbox"
          echo "CHROME_BIN=$RUNNER_TEMP/chrome-nosandbox" >> "$GITHUB_ENV"

      - name: Run tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production app
        run: npm run build

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: dist/diocesis-frontend-material/browser/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Set deploy end time
        if: always()
        run: echo "DEPLOY_FINISHED_TS=$(date +%s)" >> $GITHUB_ENV

      - name: Notify Discord Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STARTED_TS: ${{ env.DEPLOY_STARTED_TS }}
          DEPLOY_FINISHED_TS: ${{ env.DEPLOY_FINISHED_TS }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          SAFE_COMMIT_MESSAGE="${COMMIT_MESSAGE:-Sin mensaje de commit disponible}"

          DURATION_TEXT="No disponible"
          if [ -n "${DEPLOY_STARTED_TS:-}" ] && [ -n "${DEPLOY_FINISHED_TS:-}" ]; then
            DURATION_SEC=$((DEPLOY_FINISHED_TS - DEPLOY_STARTED_TS))
            MINUTES=$((DURATION_SEC / 60))
            SECONDS=$((DURATION_SEC % 60))

            if [ "$MINUTES" -gt 0 ]; then
              if [ "$SECONDS" -lt 10 ]; then
                DURATION_TEXT="${MINUTES} min 0${SECONDS} seg"
              else
                DURATION_TEXT="${MINUTES} min ${SECONDS} seg"
              fi
            else
              DURATION_TEXT="${SECONDS} seg"
            fi
          fi

          DEPLOY_STATUS_LABEL="Completado"

          jq -n \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg short_sha "$SHORT_SHA" \
            --arg commit_message "$SAFE_COMMIT_MESSAGE" \
            --arg run_url "$RUN_URL" \
            --arg deploy_status_label "$DEPLOY_STATUS_LABEL" \
            --arg duration_text "$DURATION_TEXT" \
            '{
              "username": "DevCrafters CI",
              "embeds": [
                {
                  "title": "🚀 Deploy exitoso en Hostinger",
                  "description": "El frontend Angular quedó desplegado correctamente.",
                  "color": 3066993,
                  "fields": [
                    { "name": "Rama", "value": ("`" + $branch + "`"), "inline": true },
                    { "name": "Estado", "value": $deploy_status_label, "inline": true },
                    { "name": "Duración", "value": $duration_text, "inline": true },
                    { "name": "Autor", "value": $actor, "inline": true },
                    { "name": "Commit", "value": ("`" + $short_sha + "` — " + $commit_message), "inline": false },
                    { "name": "Ver ejecución", "value": ("[Abrir workflow](" + $run_url + ")"), "inline": false }
                  ],
                  "footer": {
                    "text": "Diócesis Frontend"
                  },
                  "timestamp": (now | todateiso8601)
                }
              ]
            }' > discord-success.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @discord-success.json \
               "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STARTED_TS: ${{ env.DEPLOY_STARTED_TS }}
          DEPLOY_FINISHED_TS: ${{ env.DEPLOY_FINISHED_TS }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          SAFE_COMMIT_MESSAGE="${COMMIT_MESSAGE:-Sin mensaje de commit disponible}"

          DURATION_TEXT="No disponible"
          if [ -n "${DEPLOY_STARTED_TS:-}" ] && [ -n "${DEPLOY_FINISHED_TS:-}" ]; then
            DURATION_SEC=$((DEPLOY_FINISHED_TS - DEPLOY_STARTED_TS))
            MINUTES=$((DURATION_SEC / 60))
            SECONDS=$((DURATION_SEC % 60))

            if [ "$MINUTES" -gt 0 ]; then
              if [ "$SECONDS" -lt 10 ]; then
                DURATION_TEXT="${MINUTES} min 0${SECONDS} seg"
              else
                DURATION_TEXT="${MINUTES} min ${SECONDS} seg"
              fi
            else
              DURATION_TEXT="${SECONDS} seg"
            fi
          fi

          DEPLOY_STATUS_LABEL="Fallido"

          jq -n \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg short_sha "$SHORT_SHA" \
            --arg commit_message "$SAFE_COMMIT_MESSAGE" \
            --arg run_url "$RUN_URL" \
            --arg deploy_status_label "$DEPLOY_STATUS_LABEL" \
            --arg duration_text "$DURATION_TEXT" \
            '{
              "username": "DevCrafters CI",
              "embeds": [
                {
                  "title": "💥 Deploy fallido en Hostinger",
                  "description": "El frontend Angular no terminó de desplegarse correctamente.",
                  "color": 15158332,
                  "fields": [
                    { "name": "Rama", "value": ("`" + $branch + "`"), "inline": true },
                    { "name": "Estado", "value": $deploy_status_label, "inline": true },
                    { "name": "Duración", "value": $duration_text, "inline": true },
                    { "name": "Autor", "value": $actor, "inline": true },
                    { "name": "Commit", "value": ("`" + $short_sha + "` — " + $commit_message), "inline": false },
                    { "name": "Revisar error", "value": ("[Abrir workflow](" + $run_url + ")"), "inline": false }
                  ],
                  "footer": {
                    "text": "Diócesis Frontend"
                  },
                  "timestamp": (now | todateiso8601)
                }
              ]
            }' > discord-failure.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @discord-failure.json \
               "$DISCORD_WEBHOOK_URL"
