<div class="section-spacing">
  <div class="page-header">
    <app-title
      title="Páginas"
      description="Edita el título, el texto y la galería de fotos de cada sección del sitio"
    />
  </div>

  @if (loading()) {
    <p class="text-center">Cargando…</p>
  } @else if (pagesService.pages().length > 0) {
    <div class="table-container">
      <table class="min-w-200 table-fixed">
        <thead class="bg-neutral-50 text-neutral-600">
          <tr>
            <th class="w-1/2 px-4 py-3 text-left font-bold">Página</th>
            <th class="w-1/3 px-4 py-3 text-left font-bold">Última edición</th>
            <th class="px-4 py-3 text-right font-bold">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (row of pagesService.pages(); track row.id) {
            <tr class="border-t border-black/5">
              <td class="px-4 py-3">{{ row.title }}</td>
              <td class="px-4 py-3">{{ row.updatedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
              <td class="px-4 py-3 text-right">
                <a
                  [routerLink]="['/dashboard/paginas', row.slug]"
                  class="btn-table-info inline-flex items-center gap-1.5"
                >
                  <lucide-icon [img]="iconsService.edit" size="14" aria-hidden="true" />
                  Editar
                </a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
