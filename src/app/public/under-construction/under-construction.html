<div class="flex min-h-[60vh] flex-col items-center justify-center px-4 py-16 text-center">
  <div class="construction-glow relative mb-6 flex h-28 w-28 items-center justify-center">
    <div
      class="construction-bounce bg-custom-yellow text-custom-brown flex h-20 w-20 items-center justify-center rounded-full shadow-lg"
    >
      <lucide-icon [img]="iconsService.construction" size="36" />
    </div>
  </div>

  <h1 class="text-custom-brown text-2xl font-bold sm:text-3xl">
    @if (label) {
      {{ label }} está en construcción
    } @else {
      Esta sección está en construcción
    }
  </h1>

  <p class="text-custom-brown/70 mt-3 max-w-md text-base leading-relaxed">
    Estamos preparando esta información. En cuanto esté lista la publicaremos aquí.
  </p>

  <div class="construction-dots mt-6 flex items-center gap-2" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <a
    routerLink="/inicio"
    class="bg-custom-yellow text-custom-brown mt-8 inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-bold shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md"
  >
    <lucide-icon [img]="iconsService.home" size="16" />
    Volver al inicio
  </a>
</div>
